<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set a new password | Skillmate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="user.css?v=27" />
    <link rel="stylesheet" href="auth.css?v=8" />
    <script src="theme.js?v=2"></script>
  </head>
  <body>
    <main class="auth-layout">
      <button class="theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"><span data-theme-icon aria-hidden="true">☾</span></button>
      <section class="auth-showcase" aria-label="About Skillmate">
<a class="brand auth-brand" href="index.html"><span class="brand-name">Skillmate</span></a>
        <div class="showcase-copy">
          <p class="showcase-kicker">ACCOUNT RECOVERY</p>
          <h1>Choose a new password.</h1>
          <p>Set a new password to get back to your Skillmate account.</p>
        </div>
        <p class="showcase-footer">For students, by students.</p>
      </section>
      <section class="auth-panel" aria-label="Set a new password">
        <div class="auth-card">
          <p class="eyebrow">ACCOUNT RECOVERY</p>
          <h2>Set a new password</h2>
          <p class="auth-intro">Choose a password with at least 8 characters.</p>
          <form id="reset-form">
            <label for="new-password">New password<span class="auth-password-input"><input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="At least 8 characters" /><button class="auth-password-toggle" id="password-visibility" type="button" aria-label="Show password" aria-pressed="false">Show</button></span><small id="password-hint" class="password-hint" aria-live="polite">Use at least 8 characters.</small></label>
            <button class="button button-primary auth-submit" id="reset-submit" type="submit"><span class="auth-submit-spinner" aria-hidden="true" hidden></span><span id="reset-submit-label">Save new password</span></button>
            <p class="auth-message" id="reset-message" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-footer"><a href="forgot-password.html">Request a new reset link</a><span aria-hidden="true"> · </span><a href="login.html">Back to sign in</a></p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js?v=4"></script>
    <script src="reset.js?v=2"></script>
  </body>
</html>
