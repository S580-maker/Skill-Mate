<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360" fill="none">
  <!-- Original campus line art. Transparent ink blends with either chat theme. -->
  <g stroke="#7387a3" stroke-opacity=".14" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open notebook -->
    <g transform="translate(35 35) rotate(-9 17 14)">
      <path d="M17 5C11 1 5 1 0 3v23c6-2 11-1 17 3 6-4 11-5 17-3V3c-5-2-11-2-17 2v24"/>
      <path d="m5 9 7 1m-7 5 7 1m10-6 7-1m-7 7 7-1"/>
    </g>
    <!-- Graduation cap -->
    <g transform="translate(184 23) rotate(8 20 15)">
      <path d="m0 12 20-9 20 9-20 9L0 12Zm8 5v9c8 5 16 5 24 0v-9m8-5v14m-2 5 2-5 2 5"/>
    </g>
    <!-- Pencil -->
    <g transform="translate(340 47) rotate(24 8 19)">
      <path d="M3 8h10v27l-5 8-5-8V8Zm0 0V3h10v5M8 12v21m-5 2h10m-7 5h4"/>
    </g>
    <!-- Laptop / student work -->
    <g transform="translate(102 135) rotate(5 20 14)">
      <rect x="5" y="0" width="30" height="22" rx="2"/>
      <path d="M5 22 0 29h40l-5-7M17 26h6m-9-15 4 4 8-8"/>
    </g>
    <!-- Conversation -->
    <g transform="translate(264 125) rotate(-8 18 14)">
      <path d="M5 0h26a5 5 0 0 1 5 5v16a5 5 0 0 1-5 5H15L5 33v-7a5 5 0 0 1-5-5V5a5 5 0 0 1 5-5Z"/>
      <path d="M8 10h20M8 16h13"/>
    </g>
    <!-- Calendar -->
    <g transform="translate(28 245) rotate(-5 15 16)">
      <rect x="0" y="4" width="30" height="28" rx="3"/>
      <path d="M0 13h30M8 0v8m14-8v8M7 19h3m5 0h3m5 0h1M7 25h3m5 0h3"/>
    </g>
    <!-- Checklist -->
    <g transform="translate(193 256) rotate(9 14 18)">
      <path d="M8 3H3v32h26V3h-5"/>
      <rect x="8" y="0" width="16" height="7" rx="2"/>
      <path d="m7 15 2 2 4-5m4 3h7M7 25l2 2 4-5m4 3h7"/>
    </g>
    <!-- Clock -->
    <g transform="translate(353 251) rotate(-12 16 16)">
      <circle cx="16" cy="16" r="16"/>
      <path d="M16 6v11l7 4M16 0v2m16 14h-2M16 32v-2M0 16h2"/>
    </g>
    <!-- Small academic achievement stars, spaced between larger motifs -->
    <path d="m407 157 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6Z"/>
    <path d="m125 310 2 5 6 1-4 4 1 6-5-3-5 3 1-6-4-4 6-1 2-5Z"/>
  </g>
</svg>
